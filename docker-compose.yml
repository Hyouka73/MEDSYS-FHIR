# ==============================================================================
# INFRAESTRUCTURA DE CONTENEDORES (DOCKER COMPOSE) — MedSys-FHIR
# Middleware Axum + Base de Datos PostgreSQL 16 (NOM-004-SSA3-2012)
# Tesis: Carlos Eduardo Iglesias de la Cruz & Alexis Andrey Gálvez Roblero
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: medsys_fhir_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medsys_legado}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medsys_secure_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_legado_simulado_nom004.sql:/docker-entrypoint-initdb.d/01_schema_legado_simulado_nom004.sql:ro
      - ./docker/sql/02_bulk_data.sql:/docker-entrypoint-initdb.d/02_bulk_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medsys_legado}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medsys_network

  medsys-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medsys_fhir_server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      DATABASE_URL: "postgres://postgres:medsys_secure_pass_2026@postgres:5432/medsys_legado"
      RUST_LOG: "info,medsys_server=debug,medsys_db=debug"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medsys_network

volumes:
  postgres_data:
    driver: local

networks:
  medsys_network:
    driver: bridge
